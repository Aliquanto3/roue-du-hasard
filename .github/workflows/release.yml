name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Le tag correspond à la version de package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:size
      - name: Release (notes de docs/notes/<tag>.md si le fichier existe)
        run: |
          if [ -f "docs/notes/$GITHUB_REF_NAME.md" ]; then
            gh release create "$GITHUB_REF_NAME" dist/roue.html --title "$GITHUB_REF_NAME" --notes-file "docs/notes/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/roue.html --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
